include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
include ':bricks-soft-android-tracking-core'
project(':bricks-soft-android-tracking-core').projectDir = new File(settingsDir, '../node_modules/@bricks-soft/android-tracking-core/android').canonicalFile

// Standalone dependency builds must not write into the sibling core checkout.
gradle.projectsLoaded {
    gradle.rootProject.ext.compileSdkVersion = 36
    gradle.rootProject.subprojects { p ->
        p.layout.buildDirectory = new File(rootDir, "build-dependencies/${p.name}")
    }
}
